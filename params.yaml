preprocess:
  raw_data_path: "data/raw/stroke_risk_prediction_dataset.csv"
  train_data_path: "data/processed/train.csv"
  test_data_path: "data/processed/test.csv"
  target_column: "Stroke_Risk"
  test_size: 0.2
  random_state: 42

models:

  xgboost:
    model_path: "models/xgboost.joblib"
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.05
    random_state: 42

  random_forest:
    model_path: "models/random_forest.joblib"
    n_estimators: 100
    max_depth: 10
    random_state: 42
    n_jobs: -1

  lightgbm:
    model_path: "models/lightgbm.joblib"
    n_estimators: 100
    max_depth: 7
    learning_rate: 0.05
    random_state: 42
    n_jobs: -1

  catboost:
    model_path: "models/catboost.joblib"
    iterations: 100
    depth: 7
    learning_rate: 0.05
    random_state: 42
    verbose: false

  logistic_regression:
    model_path: "models/logistic_regression.joblib"
    C: 1.0
    max_iter: 1000
    random_state: 42