      - preprocess.target_column
    metrics:
      - metrics/logistic_regression.json:
          cache: false
    outs:
      - reports/logistic_regression_confusion_matrix.csv
      - reports/logistic_regression_classification_report.txt

  compare_models:
    cmd: python -m src.compare_models
    deps:
      - metrics/xgboost.json
      - metrics/random_forest.json
      - metrics/lightgbm.json
      - metrics/catboost.json
      - metrics/logistic_regression.json
      - src/compare_models.py
    outs:
      - reports/model_comparison.csv