stages:

  preprocess:
    cmd: python -m src.preprocess
    deps:
      - data/raw/stroke_risk_prediction_dataset.csv
      - src/preprocess.py
    params:
      - preprocess.raw_data_path
      - preprocess.train_data_path
      - preprocess.test_data_path
      - preprocess.target_column
      - preprocess.test_size
      - preprocess.random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - src/train.py
    params:
      - train.train_data_path
      - train.model_path
      - train.n_estimators
      - train.max_depth
      - train.learning_rate
      - train.random_state
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - data/processed/test.csv
      - models/model.joblib
      - src/evaluate.py
    params:
      - evaluate.test_data_path
      - evaluate.model_path
      - evaluate.metrics_path
    outs:
      - reports/confusion_matrix.csv
      - reports/classification_report.txt
    metrics:
      - metrics.json:
          cache: false