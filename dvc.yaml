stages:

  preprocess:
    cmd: python -m src.preprocess
    deps:
      - data/raw/stroke_risk_prediction_dataset.csv
      - src/preprocess.py
    params:
      - preprocess.raw_data_path
      - preprocess.train_data_path
      - preprocess.test_data_path
      - preprocess.target_column
      - preprocess.test_size
      - preprocess.random_state
    outs:
      - data/processed/train.csv
      - data/processed/test.csv


  train_xgboost:
    cmd: python -m src.train_xgboost
    deps:
      - data/processed/train.csv
      - src/train_xgboost.py
    params:
      - preprocess.train_data_path
      - preprocess.target_column
      - models.xgboost
    outs:
      - models/xgboost.joblib


  evaluate_xgboost:
    cmd: python -m src.evaluate_model --model models/xgboost.joblib --metrics metrics/xgboost.json --confusion-matrix reports/xgboost_confusion_matrix.csv --classification-report reports/xgboost_classification_report.txt
    deps:
      - data/processed/test.csv
      - models/xgboost.joblib
      - src/evaluate_model.py
    params:
      - preprocess.test_data_path
      - preprocess.target_column
    metrics:
      - metrics/xgboost.json:
          cache: false
    outs:
      - reports/xgboost_confusion_matrix.csv
      - reports/xgboost_classification_report.txt


  train_random_forest:
    cmd: python -m src.train_random_forest
    deps:
      - data/processed/train.csv
      - src/train_random_forest.py
    params:
      - preprocess.train_data_path
      - preprocess.target_column
      - models.random_forest
    outs:
      - models/random_forest.joblib


  evaluate_random_forest:
    cmd: python -m src.evaluate_model --model models/random_forest.joblib --metrics metrics/random_forest.json --confusion-matrix reports/random_forest_confusion_matrix.csv --classification-report reports/random_forest_classification_report.txt
    deps:
      - data/processed/test.csv
      - models/random_forest.joblib
      - src/evaluate_model.py
    params:
      - preprocess.test_data_path
      - preprocess.target_column
    metrics:
      - metrics/random_forest.json:
          cache: false
    outs:
      - reports/random_forest_confusion_matrix.csv
      - reports/random_forest_classification_report.txt


  train_lightgbm:
    cmd: python -m src.train_lightgbm
    deps:
      - data/processed/train.csv
      - src/train_lightgbm.py
    params:
      - preprocess.train_data_path
      - preprocess.target_column
      - models.lightgbm
    outs:
      - models/lightgbm.joblib


  evaluate_lightgbm:
    cmd: python -m src.evaluate_model --model models/lightgbm.joblib --metrics metrics/lightgbm.json --confusion-matrix reports/lightgbm_confusion_matrix.csv --classification-report reports/lightgbm_classification_report.txt
    deps:
      - data/processed/test.csv
      - models/lightgbm.joblib
      - src/evaluate_model.py
    params:
      - preprocess.test_data_path
      - preprocess.target_column
    metrics:
      - metrics/lightgbm.json:
          cache: false
    outs:
      - reports/lightgbm_confusion_matrix.csv
      - reports/lightgbm_classification_report.txt


  train_catboost:
    cmd: python -m src.train_catboost
    deps:
      - data/processed/train.csv
      - src/train_catboost.py
    params:
      - preprocess.train_data_path
      - preprocess.target_column
      - models.catboost
    outs:
      - models/catboost.joblib


  evaluate_catboost:
    cmd: python -m src.evaluate_model --model models/catboost.joblib --metrics metrics/catboost.json --confusion-matrix reports/catboost_confusion_matrix.csv --classification-report reports/catboost_classification_report.txt
    deps:
      - data/processed/test.csv
      - models/catboost.joblib
      - src/evaluate_model.py
    params:
      - preprocess.test_data_path
      - preprocess.target_column
    metrics:
      - metrics/catboost.json:
          cache: false
    outs:
      - reports/catboost_confusion_matrix.csv
      - reports/catboost_classification_report.txt


  train_logistic:
    cmd: python -m src.train_logistic
    deps:
      - data/processed/train.csv
      - src/train_logistic.py
    params:
      - preprocess.train_data_path
      - preprocess.target_column
      - models.logistic_regression
    outs:
      - models/logistic_regression.joblib


  evaluate_logistic:
    cmd: python -m src.evaluate_model --model models/logistic_regression.joblib --metrics metrics/logistic_regression.json --confusion-matrix reports/logistic_regression_confusion_matrix.csv --classification-report reports/logistic_regression_classification_report.txt
